# Configuração do painel de edição (Pages CMS — https://app.pagescms.org)
# Cada gravação no painel publica o site automaticamente em 1–2 minutos.

media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]

content:
  - name: noticias
    label: Publicações
    type: collection
    path: src/content/noticias
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [titulo, disciplina, professor, data, rascunho]
      primary: titulo
      sort: [data, titulo]
      default:
        sort: data
        order: desc
      search: [titulo, resumo, professor]
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
        description: Curto e claro. Idealmente até 80 caracteres.
      - name: resumo
        label: Resumo
        type: text
        required: true
        description: Uma ou duas frases. Aparece na lista de publicações e quando o texto é partilhado no WhatsApp.
      - name: disciplina
        label: Disciplina
        type: select
        required: true
        options:
          values:
            - name: colegio
              label: Colégio (geral)
            - name: portugues
              label: Português
            - name: ingles
              label: Inglês
            - name: frances
              label: Francês
            - name: espanhol
              label: Espanhol
            - name: historia
              label: História
            - name: geografia
              label: Geografia
            - name: matematica
              label: Matemática
            - name: ciencias-naturais
              label: Ciências Naturais
            - name: fisico-quimica
              label: Físico-Química
            - name: educacao-visual
              label: Educação Visual
            - name: tic
              label: TIC
            - name: educacao-fisica
              label: Educação Física
            - name: musica
              label: Música
            - name: emrc
              label: EMRC
            - name: cidadania
              label: Cidadania
      - name: professor
        label: Professor
        type: string
        required: true
        description: "Escreva o nome sempre da mesma forma (ex.: «Prof. João Silva»): é assim que o site junta as publicações de cada professor."
      - name: turmas
        label: Ano / turmas (opcional)
        type: string
        description: "Ex.: «8.º B» ou «9.º ano»."
      - name: data
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: imagem
        label: Imagem principal (opcional)
        type: image
        description: Horizontal. Só com alunos que têm autorização de imagem. Sem imagem, o site mostra uma capa com o nome da disciplina.
      - name: legenda
        label: Descrição da imagem
        type: string
      - name: destaque
        label: Destaque no topo da página inicial
        type: boolean
        default: false
      - name: rascunho
        label: Rascunho (não publicar)
        type: boolean
        default: false
      - name: exemplo
        label: Conteúdo de exemplo
        type: boolean
        default: false
        hidden: true
      - name: body
        label: Texto
        type: rich-text

  - name: definicoes
    label: Definições do site
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: nome
        label: Nome do jornal
        type: string
      - name: descricao
        label: Descrição (aparece no Google e nas partilhas)
        type: text
      - name: site_colegio
        label: Endereço do site do colégio
        type: string
